<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><title>Gyro Car Battle</title>
<link rel="stylesheet" href="style.css">
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<header><h1>GYRO CAR BATTLE</h1><span id="connection">연결 확인 중...</span></header>
<main>
<section id="home" class="panel">
<h2>방 만들기 / 참가하기</h2>
<input id="nickname" maxlength="12" placeholder="닉네임" value="플레이어">
<div class="actions"><button id="create">방 만들기</button><input id="roomCode" maxlength="6" placeholder="방 코드"><button id="join">참가</button></div>
<p id="notice">서버 연결 후 방을 만들 수 있어.</p>
</section>
<section id="lobby" class="panel hidden">
<div class="room-head"><h2>대기실</h2><strong id="codeLabel"></strong></div>
<p>방 코드를 친구에게 공유해.</p><ul id="players"></ul>
<div class="actions"><button id="start">게임 시작</button><button id="leave" class="secondary">나가기</button></div>
</section>
<section id="desktop" class="hidden">
<canvas id="arena" width="960" height="600"></canvas>
<p id="gameInfo">스마트폰을 가로로 들고 센서를 시작해.</p>
</section>
<section id="mobile" class="panel hidden">
<h2>운전 컨트롤</h2><p>휴대폰을 가로로 돌린 뒤 센서를 켜.</p>
<button id="sensor">자이로 센서 시작</button>
<p id="sensorStatus">센서 권한 대기 중</p>
<div class="steer"><span>좌회전</span><div id="wheel"><div></div></div><span>우회전</span></div>
<button id="accelerate">가속</button>
<button id="leaveMobile" class="secondary">나가기</button>
</section>
</main>
<script src="app.js"></script>
</body></html>
